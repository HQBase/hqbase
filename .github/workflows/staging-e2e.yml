name: Staging E2E

on:
  workflow_dispatch:

concurrency:
  group: hqbase-pro-staging-e2e
  cancel-in-progress: false

jobs:
  community-upgrade-migration:
    runs-on: ubuntu-latest
    environment: hqbase-staging
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.HQBASE_E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.HQBASE_E2E_CLOUDFLARE_API_TOKEN }}
      DEPLOYMENT_NAME: upgrade-${{ github.run_id }}
      D1_NAME: hqbase-upgrade-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check out Community
        uses: actions/checkout@v4
        with:
          repository: HQBase/hqbase
          path: .staging/community
      - name: Install Community operator dependencies
        working-directory: .staging/community
        run: pnpm install --frozen-lockfile
      - name: Create remote Community data resources
        working-directory: .staging/community
        run: >-
          pnpm hqbase install
          --name "$DEPLOYMENT_NAME"
          --d1-name "$D1_NAME"
          --skip-build
          --skip-deploy
      - name: Seed Community retention marker
        working-directory: .staging/community
        run: >-
          pnpm exec wrangler d1 execute "$D1_NAME"
          --remote
          --command
          "INSERT INTO app_settings (key, value_json, created_at, updated_at)
          VALUES ('e2e-upgrade-probe', '{\"retained\":true}', datetime('now'), datetime('now'))"
      - name: Preflight Community to Pro migration
        run: >-
          pnpm hqbase-pro upgrade
          --from-community
          --database "$D1_NAME"
          --remote
          --dry-run
      - name: Apply backed-up Community to Pro migration
        run: >-
          pnpm hqbase-pro upgrade
          --from-community
          --database "$D1_NAME"
          --remote
          --yes
      - name: Verify Community data retention
        run: |
          result=$(pnpm exec wrangler d1 execute "$D1_NAME" --remote --json \
            --command "SELECT value_json FROM app_settings WHERE key = 'e2e-upgrade-probe'")
          jq -e '.[0].results[0].value_json == "{\"retained\":true}"' <<<"$result"
      - name: Destroy Community upgrade resources
        if: always()
        working-directory: .staging/community
        run: pnpm hqbase destroy --name "$DEPLOYMENT_NAME" --scope all --yes

  fresh-install-and-bridge:
    runs-on: ubuntu-latest
    environment: hqbase-staging
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.HQBASE_E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.HQBASE_E2E_CLOUDFLARE_API_TOKEN }}
      HQBASE_PRO_STAGING_ACCESS_CLIENT_ID: ${{ secrets.HQBASE_E2E_ACCESS_CLIENT_ID }}
      HQBASE_PRO_STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.HQBASE_E2E_ACCESS_CLIENT_SECRET }}
      HQBASE_PRO_STAGING_EMAIL_DOMAIN: ${{ secrets.HQBASE_E2E_EMAIL_DOMAIN }}
      HQBASE_PRO_STAGING_OWNER_EMAIL: owner@${{ secrets.HQBASE_E2E_EMAIL_DOMAIN }}
      HQBASE_PRO_STAGING_OWNER_PASSWORD: ${{ secrets.HQBASE_E2E_OWNER_PASSWORD }}
      HQBASE_PRO_STAGING_SENDER: hello@${{ secrets.HQBASE_E2E_EMAIL_DOMAIN }}
      HQBASE_PRO_STAGING_URL: https://${{ secrets.HQBASE_E2E_APP_HOSTNAME }}
      HQBASE_PRO_STAGING_BRIDGE_TOKEN: ${{ secrets.HQBASE_PRO_E2E_BRIDGE_TOKEN }}
      HQBASE_PRO_STAGING_BRIDGE_HOST: ${{ secrets.HQBASE_PRO_E2E_BRIDGE_HOST }}
      HQBASE_BRIDGE_ACCEPTANCE_BIN: /tmp/hqbase-bridge-acceptance
      DEPLOYMENT_NAME: e2e-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check out the pinned bridge implementation
        uses: actions/checkout@v4
        with:
          repository: HQBase/hqbase-mail-bridge
          ref: d7b2f8c93db42e8b74e7c96ae4017688a6c7234a
          path: .staging/bridge
          ssh-key: ${{ secrets.HQBASE_BRIDGE_REPO_DEPLOY_KEY }}
      - name: Build the headless IMAPS/SMTPS acceptance client
        working-directory: .staging/bridge
        run: go build -o "$HQBASE_BRIDGE_ACCEPTANCE_BIN" ./cmd/acceptance
      - name: Deploy disposable Pro installation
        run: >-
          pnpm hqbase-pro install
          --name "$DEPLOYMENT_NAME"
          --worker-name hqbase-pro-e2e-staging
          --domain "$HQBASE_PRO_STAGING_EMAIL_DOMAIN"
          --no-email
          --app-domain "${HQBASE_PRO_STAGING_URL#https://}"
          --bridge-token "$HQBASE_PRO_STAGING_BRIDGE_TOKEN"
      - name: Exercise remote backup and restore
        run: |
          config=".hqbase-pro/deployments/$DEPLOYMENT_NAME/wrangler.jsonc"
          database="hqbase-pro-$DEPLOYMENT_NAME"
          pnpm exec wrangler d1 execute "$database" --remote --config "$config" \
            --command "INSERT INTO app_settings (key, value_json, created_at, updated_at) VALUES ('track1-restore-probe', '{\"state\":\"before\"}', datetime('now'), datetime('now'))"
          pnpm hqbase-pro backup --name "$DEPLOYMENT_NAME" --output /tmp/track1-backup.json
          pnpm exec wrangler d1 execute "$database" --remote --config "$config" \
            --command "UPDATE app_settings SET value_json = '{\"state\":\"after\"}', updated_at = datetime('now') WHERE key = 'track1-restore-probe'"
          pnpm hqbase-pro restore --name "$DEPLOYMENT_NAME" --backup /tmp/track1-backup.json --yes
          result=$(pnpm exec wrangler d1 execute "$database" --remote --config "$config" --json \
            --command "SELECT value_json FROM app_settings WHERE key = 'track1-restore-probe'")
          jq -e '.[0].results[0].value_json == "{\"state\":\"before\"}"' <<<"$result"
      - name: Verify the Fly bridge can reach Pro
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              "https://$HQBASE_PRO_STAGING_BRIDGE_HOST/ready" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Fly bridge could not reach Pro within 120 seconds"
          exit 1
      - name: Exercise Pro app passwords through real IMAPS and SMTPS
        run: pnpm test:e2e:staging
      - name: Destroy disposable Pro installation
        if: always()
        run: pnpm hqbase-pro destroy --name "$DEPLOYMENT_NAME" --scope all --yes
