name: Staging E2E

run-name: Staging E2E · ${{ inputs.candidate_ref || github.sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Reviewed HQBase commit or ref to validate
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: hqbase-staging-e2e
  cancel-in-progress: false

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    environment: hqbase-staging
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.HQBASE_E2E_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.HQBASE_E2E_CLOUDFLARE_API_TOKEN }}
      HQBASE_STAGING_ACCESS_CLIENT_ID: ${{ secrets.HQBASE_E2E_ACCESS_CLIENT_ID }}
      HQBASE_STAGING_ACCESS_CLIENT_SECRET: ${{ secrets.HQBASE_E2E_ACCESS_CLIENT_SECRET }}
      HQBASE_STAGING_EMAIL_DOMAIN: ${{ secrets.HQBASE_E2E_EMAIL_DOMAIN }}
      HQBASE_STAGING_OWNER_EMAIL: ${{ secrets.HQBASE_E2E_OWNER_EMAIL }}
      HQBASE_STAGING_OWNER_PASSWORD: ${{ secrets.HQBASE_E2E_OWNER_PASSWORD }}
      HQBASE_STAGING_OAUTH_CLIENT_ID: ${{ vars.HQBASE_E2E_OAUTH_CLIENT_ID }}
      HQBASE_STAGING_SENDER: hello@${{ secrets.HQBASE_E2E_EMAIL_DOMAIN }}
      HQBASE_STAGING_URL: https://${{ secrets.HQBASE_E2E_APP_HOSTNAME }}
      DEPLOYMENT_NAME: e2e-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-playwright-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify resumable operator provisioning and cleanup
        run: node scripts/test-cli-recovery.mjs "recovery-${{ github.run_id }}"
      - name: Create disposable customer resources
        run: >-
          pnpm hqbase install
          --name "$DEPLOYMENT_NAME"
          --worker-name hqbase-e2e-staging
          --domain "$HQBASE_STAGING_EMAIL_DOMAIN"
          --no-email
          --app-domain "${HQBASE_STAGING_URL#https://}"
          --auth-url "$HQBASE_STAGING_URL"
          --oauth-mode customer
          --oauth-client-id "$HQBASE_STAGING_OAUTH_CLIENT_ID"
          --skip-build
          --skip-deploy
      - name: Verify populated SQL migration upgrade and retry
        run: |
          config=".hqbase/deployments/$DEPLOYMENT_NAME/wrangler.jsonc"
          legacy_dir=".hqbase/deployments/$DEPLOYMENT_NAME/migrations-before-0014"
          mkdir -p "$legacy_dir"
          for migration in migrations/00*.sql; do
            if [[ "$(basename "$migration")" != "0014_unassigned_messages.sql" ]]; then
              cp "$migration" "$legacy_dir/"
            fi
          done
          set_migrations_dir() {
            jq --arg directory "$1" \
              '.d1_databases[0].migrations_dir = $directory | del(.d1_databases[0].migrations_pattern)' \
              "$config" > "$config.tmp"
            mv "$config.tmp" "$config"
          }

          set_migrations_dir "migrations-before-0014"
          pnpm exec wrangler d1 migrations apply DB --remote --config "$config"
          pnpm exec wrangler d1 execute DB --remote --config "$config" \
            --command "INSERT INTO app_settings (key, value_json, created_at, updated_at) VALUES ('sql-upgrade-probe', '{\"state\":\"preserved\"}', datetime('now'), datetime('now'))"
          pnpm exec wrangler d1 execute DB --remote --config "$config" \
            --command "INSERT INTO threads (id, subject_normalized, last_message_at, created_at, updated_at) VALUES ('thr_sql_upgrade', 'sql upgrade', datetime('now'), datetime('now'), datetime('now'))"
          pnpm exec wrangler d1 execute DB --remote --config "$config" \
            --command "INSERT INTO messages (id, thread_id, mailbox_id, direction, folder, from_address, to_json, cc_json, bcc_json, subject, snippet, text_body, references_json, created_at, updated_at) VALUES ('msg_sql_upgrade', 'thr_sql_upgrade', NULL, 'inbound', 'catchall', 'sender@example.com', '[]', '[]', '[]', 'SQL upgrade', 'SQL upgrade', 'SQL upgrade', '[]', datetime('now'), datetime('now'))"
          set_migrations_dir "../../../migrations"
          pnpm exec wrangler d1 migrations apply DB --remote --config "$config"
          pnpm exec wrangler d1 migrations apply DB --remote --config "$config"
          result=$(pnpm exec wrangler d1 execute DB --remote --config "$config" --json \
            --command "SELECT (SELECT value_json FROM app_settings WHERE key = 'sql-upgrade-probe') AS value_json, (SELECT is_unassigned FROM messages WHERE id = 'msg_sql_upgrade') AS is_unassigned, (SELECT is_unassigned FROM message_changes WHERE message_id = 'msg_sql_upgrade' LIMIT 1) AS change_is_unassigned, (SELECT COUNT(*) FROM d1_migrations) AS migration_count")
          jq -e '.[0].results[0] == {"value_json":"{\"state\":\"preserved\"}","is_unassigned":1,"change_is_unassigned":1,"migration_count":14}' <<<"$result"
      - name: Deploy reviewed source candidate
        run: |
          config=".hqbase/deployments/$DEPLOYMENT_NAME/wrangler.jsonc"
          AUTH_SECRET="$(openssl rand -base64 48)"
          echo "::add-mask::$AUTH_SECRET"
          echo "HQBASE_STAGING_AUTH_SECRET=$AUTH_SECRET" >> "$GITHUB_ENV"
          AUTH_SECRET="$AUTH_SECRET" node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import webpush from "web-push";
            const vapid = webpush.generateVAPIDKeys();
            writeFileSync("/tmp/hqbase-e2e-secrets.json", `${JSON.stringify({
              BETTER_AUTH_SECRET: process.env.AUTH_SECRET,
              VAPID_PUBLIC_KEY: vapid.publicKey,
              VAPID_PRIVATE_KEY: vapid.privateKey
            })}\n`, { mode: 0o600 });
          '
          pnpm build
          pnpm exec wrangler d1 migrations apply DB --remote --config "$config"
          pnpm exec wrangler deploy --config "$config" --secrets-file /tmp/hqbase-e2e-secrets.json
          node --input-type=module -e '
            import {
              configPath,
              recordWorkerDeployedForConfig
            } from "./scripts/hqbase/manifest.mjs";
            recordWorkerDeployedForConfig(
              configPath(process.env.DEPLOYMENT_NAME),
              "hqbase-e2e-staging"
            );
          '
      - name: Wait for the disposable custom domain
        run: |
          readiness_paths=(
            "/api/health"
            "/.well-known/oauth-protected-resource/api/v1"
            "/.well-known/oauth-authorization-server/api/auth"
            "/skills/hqbase-mail/SKILL.md"
          )

          probe() {
            local path="$1"
            local status
            status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
              -H "CF-Access-Client-Id: $HQBASE_STAGING_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $HQBASE_STAGING_ACCESS_CLIENT_SECRET" \
              "$HQBASE_STAGING_URL$path" || true)
            [[ "$status" == "200" ]]
          }

          for attempt in $(seq 1 150); do
            ready=true
            for path in "${readiness_paths[@]}"; do
              if ! probe "$path"; then
                ready=false
                break
              fi
            done
            if [[ "$ready" == "true" ]]; then
              exit 0
            fi
            sleep 2
          done

          for path in "${readiness_paths[@]}"; do
            body_file=$(mktemp)
            status=$(curl --silent --show-error --output "$body_file" --write-out "%{http_code}" \
              -H "CF-Access-Client-Id: $HQBASE_STAGING_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $HQBASE_STAGING_ACCESS_CLIENT_SECRET" \
              "$HQBASE_STAGING_URL$path" || true)
            if [[ "$status" != "200" ]]; then
              echo "::error title=HQBase readiness failed::$path returned HTTP ${status:-000}"
              head -c 1000 "$body_file"
              echo
            fi
            rm -f "$body_file"
          done
          echo "Disposable HQBase discovery surface was not ready within 300 seconds"
          exit 1
      - name: Verify PWA, app shell, access, and operator lifecycle
        run: pnpm test:e2e:staging
      - name: Move the live portal hostname and move it back
        env:
          HQBASE_DOMAIN_API_TOKEN: ${{ secrets.HQBASE_E2E_CLOUDFLARE_API_TOKEN }}
          HQBASE_DOMAIN_ACCESS_CLIENT_ID: ${{ secrets.HQBASE_E2E_ACCESS_CLIENT_ID }}
          HQBASE_DOMAIN_ACCESS_CLIENT_SECRET: ${{ secrets.HQBASE_E2E_ACCESS_CLIENT_SECRET }}
          HQBASE_DOMAIN_MOVE_HOST: move-${{ github.run_id }}.${{ secrets.HQBASE_E2E_EMAIL_DOMAIN }}
        run: node scripts/test-domain-staging.mjs
      - name: Recover the staging portal before resource cleanup
        if: always()
        env:
          HQBASE_DOMAIN_API_TOKEN: ${{ secrets.HQBASE_E2E_CLOUDFLARE_API_TOKEN }}
          HQBASE_DOMAIN_ACCESS_CLIENT_ID: ${{ secrets.HQBASE_E2E_ACCESS_CLIENT_ID }}
          HQBASE_DOMAIN_ACCESS_CLIENT_SECRET: ${{ secrets.HQBASE_E2E_ACCESS_CLIENT_SECRET }}
          HQBASE_DOMAIN_MOVE_HOST: move-${{ github.run_id }}.${{ secrets.HQBASE_E2E_EMAIL_DOMAIN }}
        run: node scripts/test-domain-staging.mjs --cleanup-only
      - name: Exercise populated remote backup and restore
        run: |
          config=".hqbase/deployments/$DEPLOYMENT_NAME/wrangler.jsonc"
          database="hqbase-$DEPLOYMENT_NAME"
          pnpm exec wrangler d1 execute "$database" --remote --config "$config" \
            --command "INSERT INTO app_settings (key, value_json, created_at, updated_at) VALUES ('staging-restore-probe', '{\"state\":\"before\"}', datetime('now'), datetime('now'))"
          pnpm hqbase backup --name "$DEPLOYMENT_NAME" --output /tmp/hqbase-backup.json
          pnpm exec wrangler d1 execute "$database" --remote --config "$config" \
            --command "UPDATE app_settings SET value_json = '{\"state\":\"after\"}', updated_at = datetime('now') WHERE key = 'staging-restore-probe'"
          pnpm hqbase restore --name "$DEPLOYMENT_NAME" --backup /tmp/hqbase-backup.json --yes
          result=$(pnpm exec wrangler d1 execute "$database" --remote --config "$config" --json \
            --command "SELECT value_json FROM app_settings WHERE key = 'staging-restore-probe'")
          jq -e '.[0].results[0].value_json == "{\"state\":\"before\"}"' <<<"$result"
      - name: Upload non-secret deployment record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hqbase-staging-manifest-${{ github.run_id }}
          path: .hqbase/deployments/e2e-${{ github.run_id }}/manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Destroy disposable resources
        if: always()
        run: pnpm hqbase destroy --name "$DEPLOYMENT_NAME" --scope all --yes
