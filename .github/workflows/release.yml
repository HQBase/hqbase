name: Signed Pro release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Package and sign
        env:
          HQBASE_RELEASE_PRIVATE_KEY: ${{ secrets.HQBASE_RELEASE_PRIVATE_KEY }}
          HQBASE_RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          export HQBASE_RELEASE_VERSION="${HQBASE_RELEASE_VERSION#v}"
          pnpm release:package
      - name: Publish private artifact and public signed manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HQBASE_RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          export HQBASE_RELEASE_VERSION="${HQBASE_RELEASE_VERSION#v}"
          pnpm exec wrangler r2 object put "hqbase-releases/artifacts/pro/${HQBASE_RELEASE_VERSION}.tar.gz" --file "release/pro-${HQBASE_RELEASE_VERSION}.tar.gz" --remote
          pnpm exec wrangler r2 object put "hqbase-releases/manifests/pro/stable.json" --file release/stable.json --remote
