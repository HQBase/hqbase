name: Signed HQBase release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version
        required: true
      min_version:
        description: Oldest HQBase version supported by this release
        required: false

permissions:
  contents: write

concurrency:
  group: hqbase-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 25
    env:
      BETTER_AUTH_SECRET: ci-auth-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm deploy:dry-run
      - name: Verify release input and signing key
        env:
          HQBASE_RELEASE_PRIVATE_KEY: ${{ secrets.HQBASE_RELEASE_PRIVATE_KEY }}
          HQBASE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test -n "$HQBASE_RELEASE_PRIVATE_KEY"
          release_version="${HQBASE_RELEASE_VERSION#v}"
          test "$release_version" = "$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "main"
          if gh release view "v${release_version}" >/dev/null 2>&1; then
            echo "Release v${release_version} already exists and is immutable." >&2
            exit 1
          fi
      - name: Package and sign public release
        env:
          HQBASE_RELEASE_PRIVATE_KEY: ${{ secrets.HQBASE_RELEASE_PRIVATE_KEY }}
          HQBASE_RELEASE_VERSION: ${{ inputs.version }}
          HQBASE_MIN_VERSION: ${{ inputs.min_version }}
        run: |
          export HQBASE_RELEASE_VERSION="${HQBASE_RELEASE_VERSION#v}"
          pnpm release:package
      - name: Extract release notes
        env:
          HQBASE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          export HQBASE_RELEASE_VERSION="${HQBASE_RELEASE_VERSION#v}"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const version = process.env.HQBASE_RELEASE_VERSION;
            const changelog = readFileSync("CHANGELOG.md", "utf8");
            const start = changelog.indexOf(`## ${version}\n`);
            if (start < 0) throw new Error(`Missing changelog entry for ${version}`);
            const bodyStart = start + `## ${version}\n`.length;
            const next = changelog.indexOf("\n## ", bodyStart);
            const body = changelog.slice(bodyStart, next < 0 ? undefined : next).trim();
            writeFileSync("release/notes.md", `${body}\n`);
          '
      - name: Publish immutable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          HQBASE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          release_version="${HQBASE_RELEASE_VERSION#v}"
          gh release create "v${release_version}" \
            --target "$GITHUB_SHA" \
            --title "HQBase ${release_version}" \
            --notes-file release/notes.md \
            --latest \
            "release/hqbase-${release_version}.tar.gz" \
            "release/hqbase-${release_version}.sha256" \
            "release/manifest-${release_version}.json" \
            "release/stable.json"
      - name: Verify public stable asset, signature, and digest
        env:
          HQBASE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          release_version="${HQBASE_RELEASE_VERSION#v}"
          stable_url="https://github.com/HQBase/hqbase/releases/latest/download/stable.json"
          artifact_url="https://github.com/HQBase/hqbase/releases/download/v${release_version}/hqbase-${release_version}.tar.gz"
          for attempt in $(seq 1 30); do
            if curl --fail --location --silent --show-error "$stable_url" --output /tmp/stable.json &&
               curl --fail --location --silent --show-error "$artifact_url" --output /tmp/hqbase.tar.gz; then
              break
            fi
            test "$attempt" -lt 30
            sleep 2
          done
          node --input-type=module -e '
            import { createHash, createPublicKey, verify } from "node:crypto";
            import { readFileSync, statSync } from "node:fs";
            const version = process.env.HQBASE_RELEASE_VERSION.replace(/^v/, "");
            const config = JSON.parse(readFileSync("config/product.json", "utf8"));
            const envelope = JSON.parse(readFileSync("/tmp/stable.json", "utf8"));
            const key = createPublicKey({
              key: Buffer.from(config.releasePublicKey, "base64"),
              format: "der",
              type: "spki"
            });
            if (!verify(null, Buffer.from(envelope.payload, "base64url"), key, Buffer.from(envelope.signature, "base64url"))) {
              throw new Error("Published stable manifest signature is invalid.");
            }
            const manifest = JSON.parse(Buffer.from(envelope.payload, "base64url").toString("utf8"));
            if (manifest.product !== "hqbase" || manifest.version !== version) {
              throw new Error("Published stable manifest identity is invalid.");
            }
            const bytes = readFileSync("/tmp/hqbase.tar.gz");
            if (createHash("sha256").update(bytes).digest("hex") !== manifest.artifact.sha256 ||
                statSync("/tmp/hqbase.tar.gz").size !== manifest.artifact.size) {
              throw new Error("Published artifact does not match the signed manifest.");
            }
          '
